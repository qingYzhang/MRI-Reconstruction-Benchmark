dataset:
  name: fastmri_brain
  challenge: multicoil
  acquisition: AXT2

splits:
  train_volumes: 2678
  val_volumes: 815

sampling:
  type: random_cartesian
  accelerations:
    4:
      center_fraction: 0.08
    8:
      center_fraction: 0.04

sensitivity:
  method: espirit
  crop: 0.0
  kernel_width: 6
  thresh: 0.02

cg_sense:
  iterations: 50
  lambda:
    4: 0.01
    8: 0.01

hyperparameter_tuning:
  split: train
  num_volumes: 30
  seed: 20260904
  selection_metric: nmse

evaluation:
  metrics:
    - nmse
    - psnr
    - ssim
